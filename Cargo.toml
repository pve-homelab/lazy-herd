[package]
name = "lazy-herd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lazy Herd — a Herdr plugin bundling git, workspaces, secrets, SSH, agents, bootstrap, search, doctor, and config behind one TUI menu"
readme = "README.md"
repository = "https://github.com/pve-homelab/lazy-herd"

[[bin]]
name = "lazy-herd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
html2text = "0.12"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
ureq = { version = "2", features = ["tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
